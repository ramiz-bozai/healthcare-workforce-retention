[project]
name = "carestaff-insight"
version = "0.1.0"
description = "CareStaff Insight — synthetic healthcare workforce retention prototype for Databricks FE Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "duckdb>=1.2",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "streamlit>=1.39",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
