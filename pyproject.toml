[project]
name = "carestaff-insight"
version = "0.1.0"
description = "CareStaff Insight — synthetic healthcare workforce retention prototype for Databricks FE Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "duckdb>=1.2",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "databricks-sql-connector>=3.6",
    "databricks-sdk>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
